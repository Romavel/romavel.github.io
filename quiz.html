        position: fixed;

        left: 0;

      }

      .top-menu a,

        padding: 8px 16px;
        border: none;
        background-color: #4a4a8a;
        color: white;

        cursor: pointer;

        transition: background-color 0.3s;

        background-color: #37376a;
      }

      .setup {
        margin-top: 80px;
        margin-bottom: 20px;
      }

      .question {
        margin-top: 20px;
        margin-bottom: 20px;
        padding: 15px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      .dark-mode .question {
        background-color: #2e2e2e;
      }

      .answers label {
        display: block;
        margin: 8px 0;
        cursor: pointer;
      }

      .check-button,
      .reset-button {
        margin-top: 20px;
        padding: 10px 20px;
        background-color: #4a4a8a;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .correct {
        color: green;
      }

      .incorrect {
        color: red;
      }

      #result {
        margin-top: 20px;
        font-weight: bold;
      }

      }

      let selectedQuestions = [];

      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
      }

      function startQuiz() {
        const count = parseInt(document.getElementById("questionCount").value);
        selectedQuestions = [...allQuestions];
        shuffle(selectedQuestions);
        selectedQuestions = selectedQuestions.slice(
          0,
          Math.min(count, allQuestions.length)
        );

        document.querySelector(".check-button").style.display = "inline-block";
        document.querySelector(".reset-button").style.display = "inline-block";
        document.querySelector(".setup").style.display = "none";
        generateQuiz();
      }

      function generateQuiz() {
        const quizContainer = document.getElementById("quiz");
        quizContainer.innerHTML = "";
        document.getElementById("result").innerHTML = "";

        selectedQuestions.forEach((q, index) => {
          shuffle(q.answers);
          const correctCount = q.answers.filter((a) => a.correct).length;
          const inputType = correctCount > 1 ? "checkbox" : "radio";

          const questionDiv = document.createElement("div");
          questionDiv.classList.add("question");
          questionDiv.innerHTML = `<strong id="q${index}"> ${index + 1}. ${
            q.question
          }</strong>`;

          const answersDiv = document.createElement("div");
          answersDiv.classList.add("answers");

          q.answers.forEach((a, answerIndex) => {
            answersDiv.innerHTML += `
            <label>
              <input type="${inputType}" name="question${index}${
              inputType === "checkbox" ? "[]" : ""
            }" value="${a.correct}"> ${a.text}
            </label>
          `;
          });

          questionDiv.appendChild(answersDiv);
          quizContainer.appendChild(questionDiv);
        });
      }

      function checkAnswers() {
        const answers = document.querySelectorAll(".answers");
        let totalScore = 0;

        answers.forEach((answerBlock, index) => {
          const inputs = answerBlock.querySelectorAll("input");
          let correctAnswers = 0;
          let correctSelected = 0;
          let wrongSelected = 0;

          inputs.forEach((input) => {
            if (input.value === "true") correctAnswers++;
          });

          inputs.forEach((input) => {
            const label = input.parentElement;
            if (input.value === "true") label.classList.add("correct");
            if (input.checked && input.value === "true") correctSelected++;
            if (input.checked && input.value === "false") {
              label.classList.add("incorrect");
              wrongSelected++;
            }
          });

          let questionScore =
            correctSelected / correctAnswers - wrongSelected / correctAnswers;
          questionScore = Math.max(0, questionScore);
          totalScore += questionScore;

          // Dodajemy punkty przy pytaniu
          const questionLabel = document.getElementById(`q${index}`);
          questionLabel.innerHTML += ` [${questionScore.toFixed(2)} pkt]`;
        });

        document.getElementById(
          "result"
        ).innerHTML = `Twój wynik: ${totalScore.toFixed(2)} / ${
          selectedQuestions.length
        }`;
        document
          .getElementById("result")
          .scrollIntoView({ behavior: "smooth" });
      }

      function resetQuiz() {
        document.querySelector(".setup").style.display = "block";
        document.querySelector(".check-button").style.display = "none";
        document.querySelector(".reset-button").style.display = "none";
        document.getElementById("quiz").innerHTML = "";
        document.getElementById("result").innerHTML = "";
